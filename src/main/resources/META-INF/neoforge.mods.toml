modLoader="javafml"
loaderVersion="[1,)"
license="CC0-1.0"

[[mixins]]
    config="bebpm.mixins.json"

[[mods]]
    modId="${id}"
    version="${version}"
    displayName="${name}"
    authors="CozyStudios"
    description='''Breaks Y-level and line-of-sight restrictions for bookshelves powering enchanting tables. Expanded range, no air-gap needed, tag-based for mod compatibility.'''

[[dependencies.${id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${id}]]
    modId="minecraft"
    type="required"
    versionRange="${mc_range_toml}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${id}]]
    modId="cloth_config"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
